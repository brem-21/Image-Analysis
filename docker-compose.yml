services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: imdb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imdb
      POSTGRES_PASSWORD: imdb_pass
      POSTGRES_DB: imdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdb -d imdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: imdb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@imdb.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"          # open http://localhost:5050
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro   # pre-register the DB

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imdb_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # carries API keys, JWT_SECRET, S3 creds, etc.
    environment:
      # These override any matching keys in .env at runtime
      DATABASE_URL: postgresql://imdb:imdb_pass@postgres:5432/imdb
      AUTO_CREATE_TABLES: "false"   # Alembic handles schema via entrypoint.sh
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8080"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
